<!doctype html>
<html lang="en">
<head>
<base href="./">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Setlist</title>
<style>
  @font-face{font-family:Display;src:url(display.woff2) format("woff2");font-display:swap}
  html,body{margin:0;height:100%;background:#0a0814;color:#f3f0ff;font:16px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vh,16px);padding:16px;box-sizing:border-box;text-align:center;background:radial-gradient(ellipse at 50% 0,rgba(58,28,110,.72),rgba(10,8,20,.92) 70%)}
  .col{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vh,14px);width:100%;max-width:440px}
  .hidden{display:none!important}
  h1{margin:0;font:800 clamp(30px,7vmin,54px)/1.05 Display,system-ui,sans-serif;letter-spacing:-.5px;background:linear-gradient(95deg,#ff7a9c,#ffd166 55%,#7fe3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  button{font:inherit;font-weight:650;color:#160f2a;background:#ffd166;border:0;border-radius:12px;padding:12px 22px;min-height:44px;cursor:pointer}
  button:focus-visible{outline:3px solid #fff;outline-offset:2px}
  button.alt{background:#2d2552;color:#f3f0ff}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
  .tier{min-width:84px;padding:8px 10px;line-height:1.15}
  .tier.on{background:#7fe3ff;color:#160f2a}
  .tier b{display:block;font-size:12px;letter-spacing:1px;font-weight:600}.tier b:empty{display:none}
  #play{font-size:21px;padding:14px 56px;box-shadow:0 0 28px rgba(255,209,102,.45)}
  #play:disabled{opacity:.75}
  .song{flex:1;min-width:0}
  #tag{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:#7fe3ff}
  #song{font-size:clamp(18px,3.4vmin,24px);font-weight:650}
  #meta,small{font-size:13px;color:#cfc8ea}
  .disc{margin:0;font-size:12px;color:#cfc8ea;max-width:420px}
  .icon{width:44px;height:44px;min-width:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:#2d2552;color:#f3f0ff;border-radius:50%}
  .icon svg,#like svg{width:22px;height:22px;fill:currentColor;vertical-align:-5px}
  .corner{position:fixed;top:10px;z-index:5;background:rgba(45,37,82,.82)}
  #mute{left:10px} #pause{right:10px}
  #like{display:inline-flex;gap:8px;align-items:center}
  #like.on{background:#ff7a9c;color:#160f2a}
  #ends{font-size:15px;color:#cfc8ea} #stars{font:800 34px/1 Display,system-ui,sans-serif;color:#ffd166;letter-spacing:6px;min-height:34px}
  #pct{font:800 clamp(40px,10vmin,64px)/1 Display,system-ui,sans-serif}
  @media (max-height:520px){
    .panel{flex-direction:row;gap:24px;padding:10px 64px}
    .col{gap:7px} h1{font-size:30px} #play{padding:10px 44px;font-size:18px} #stars{font-size:24px;min-height:24px} #pct{font-size:36px}
    .disc{font-size:11px}
  }
</style>
</head>
<body>
<canvas id="c" aria-label="rhythm game lanes"></canvas>
<div id="title" class="panel hidden">
  <div class="col">
    <h1>Daily Setlist</h1>
    <div class="row" style="width:100%;flex-wrap:nowrap">
      <button id="prev" class="icon" aria-label="Previous song"><svg viewBox="0 0 24 24"><path d="M15.5 4 7 12l8.5 8 1.9-2-6.3-6 6.3-6z"/></svg></button>
      <div class="song"><div id="tag">Today's song</div><div id="song">Loading</div><div id="meta"></div></div>
      <button id="next" class="icon" aria-label="Next song"><svg viewBox="0 0 24 24"><path d="M8.5 4 17 12l-8.5 8-1.9-2 6.3-6-6.3-6z"/></svg></button>
    </div>
    <div class="row" role="group" aria-label="difficulty">
      <button class="tier alt" data-t="easy">Easy<b></b></button><button class="tier alt" data-t="normal">Normal<b></b></button><button class="tier alt" data-t="hard">Hard<b></b></button>
    </div>
  </div>
  <div class="col">
    <button id="play">Play</button>
    <small id="stats"></small>
    <div class="row"><button id="cal" class="alt">Calibrate timing</button></div>
    <small id="calv"></small>
    <p class="disc" id="disclosure">Music: original song generated by AI (ACE-Step 1.5), made for this game by iLazy. Not a human performance.</p>
  </div>
</div>
<div id="paused" class="panel hidden">
  <h1>Paused</h1>
  <div class="row"><button id="resume">Continue</button><button id="stop" class="alt">Stop song</button></div>
</div>
<div id="end" class="panel hidden">
  <div class="col">
    <h1 id="endh"></h1><div id="pct"></div><div id="stars" aria-hidden="true"></div><div id="ends"></div>
  </div>
  <div class="col">
    <div class="row"><button id="nextsong">Next song</button><button id="again" class="alt">Play again</button></div>
    <div class="row"><button id="like" class="alt"><svg viewBox="0 0 24 24"><path d="M12 21 3.5 12.6A5.4 5.4 0 0 1 11.1 5l.9.9.9-.9a5.4 5.4 0 0 1 7.6 7.6z"/></svg><span>Like this song</span></button><button id="back" class="alt">Setlist</button></div>
  </div>
</div>
<button id="mute" class="icon corner" aria-label="Mute" aria-pressed="false"><svg viewBox="0 0 24 24"><path id="mutep" d="M4 9v6h4l5 5V4L8 9zm12 3a4 4 0 0 0-2-3.5v7A4 4 0 0 0 16 12z"/></svg></button>
<button id="pause" class="icon corner hidden" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
<script type="module" src="game.js"></script>
</body>
</html>
