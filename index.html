<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self' https://ntfy.sh; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; frame-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>R&amp;D Room</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="R&amp;D Room">
<meta name="theme-color" content="#efe6d2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#201c17" media="(prefers-color-scheme: dark)">
<style>
:root{
  --enamel:#efe6d2;--enamel2:#e4d8bd;--ink:#1f1b16;--soft:#6b6152;--paper:#fffaf0;--paperline:#e6dcc4;
  --tomato:#e4472b;--tomatolit:#ff7a55;--tomatodeep:#a92c17;--brass:#d9a927;--brassdeep:#9b7612;--teal:#14786a;
  --counter:#231f19;--digit:#ffc94d;--stamp:#c5321a;
  --cond:"Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --type:"American Typewriter","Courier New",ui-monospace,monospace;
  --body:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --enamel:#201c17;--enamel2:#2a251e;--ink:#f2e9d8;--soft:#b3a78f;--paper:#2f2a22;--paperline:#463e32;
  --counter:#100e0b;--stamp:#ff6a4d;--teal:#3fc4ad;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--enamel);color:var(--ink);font:17px/1.4 var(--body);overscroll-behavior:none}
body{position:fixed;inset:0;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
[hidden]{display:none!important}

/* the machine */
#machine{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 10px);
  background:repeating-linear-gradient(90deg,transparent 0 118px,var(--enamel2) 118px 120px),var(--enamel)}
.plate{display:flex;align-items:center;gap:12px;padding:6px 14px;border:3px solid var(--ink);border-radius:6px;background:var(--brass);color:#1f1b16;box-shadow:0 3px 0 var(--ink)}
.plate h1{margin:0;font:800 22px/1 var(--cond);letter-spacing:.14em}
.rivet{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff5c9,#7a5c0c 75%);border:1px solid #1f1b16}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
.bezel{--d:min(66vw,40vh,320px);width:calc(var(--d) + 44px);height:calc(var(--d) + 44px);border-radius:50%;display:grid;place-items:center;
  background:repeating-conic-gradient(var(--brass) 0 12deg,var(--brassdeep) 12deg 24deg);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
#big{width:var(--d);height:var(--d);border-radius:50%;border:5px solid #1f1b16;padding:0;color:#fff4e0;position:relative;
  background:radial-gradient(circle at 34% 26%,var(--tomatolit),var(--tomato) 52%,var(--tomatodeep) 100%);
  box-shadow:0 16px 0 var(--tomatodeep),0 16px 0 5px #1f1b16,inset 0 -10px 22px rgba(0,0,0,.18);
  transform:translateY(-12px);transition:transform .07s ease-out,box-shadow .07s ease-out;
  font:800 clamp(38px,12vw,58px)/1 var(--cond);letter-spacing:.08em;text-shadow:0 3px 0 rgba(0,0,0,.28)}
#big:active,#big.down{transform:translateY(2px);box-shadow:0 2px 0 var(--tomatodeep),0 2px 0 5px #1f1b16,inset 0 8px 22px rgba(0,0,0,.25)}
#big.empty{filter:saturate(.25) brightness(.9)}
#big small{display:block;margin-top:6px;font:600 14px/1.2 var(--body);letter-spacing:0;text-shadow:none;opacity:.92}
.slot{width:62%;max-width:250px;height:10px;margin:22px 0 4px;border-radius:6px;background:#1f1b16;box-shadow:inset 0 3px 3px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.35)}
#hint{margin:6px 0 0;color:var(--soft);font-size:15px;text-align:center;min-height:1.4em}

.gauges{width:100%;max-width:440px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g{border:3px solid var(--ink);border-radius:8px;background:var(--counter);padding:7px 4px 6px;text-align:center;color:var(--digit);min-width:0}
.g b{display:block;font:700 24px/1.1 ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g b.small{font-size:15px;line-height:1.75}
.g span{display:block;margin-top:3px;font:600 10.5px/1.15 var(--cond);letter-spacing:.09em;text-transform:uppercase;color:#d8cdb6}
#status{width:100%;max-width:440px;margin:8px 0 0;font-size:14px;line-height:1.3;color:var(--soft);text-align:center;min-height:2.6em}
#more{border:0;background:none;color:var(--soft);font-size:13px;text-decoration:underline;padding:6px 10px}

/* the ticket */
.sheet{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);z-index:5;
  padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 14px);transition:transform .32s cubic-bezier(.2,.9,.25,1);transform:translateY(0)}
.sheet.off{transform:translateY(105%)}
.sheet.away{transform:translateY(-105%);transition-duration:.22s}
.sheet::before{content:"";position:absolute;left:0;right:0;top:-1px;height:10px;background:radial-gradient(circle at 10px 0,var(--enamel) 6px,transparent 6.5px) 0 0/20px 10px repeat-x}
.tick-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 12px}
.tag{font:800 15px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;border:2.5px solid var(--ink);border-radius:4px;padding:5px 8px}
.linky{border:0;background:none;padding:8px;color:var(--soft);font-size:15px;text-decoration:underline}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;border-bottom:2px dashed var(--paperline)}
.topic{margin:0 0 12px;color:var(--soft);font:14px/1.35 var(--type)}
.topic b{font-weight:700}
.big-text{margin:0 0 12px;font-size:22px;line-height:1.32;font-weight:600}
.why{margin:0;color:var(--soft);font-size:16px}
.why+.why{margin-top:10px}
.label{margin:14px 0 4px;font:700 12px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.quote{margin:0;font-size:21px;line-height:1.32;font-weight:600}
.ctx{margin:0;font:15px/1.4 var(--type);color:var(--ink);opacity:.85}
.controls{padding-top:12px}
.ask{margin:0 0 8px;font-weight:700}
.ask small{display:block;font-weight:400;color:var(--soft);font-size:14px;line-height:1.3;margin-top:2px}
.row{display:flex;gap:8px}
.row+.row,.ask+.row{margin-top:8px}
.btn{flex:1;min-height:54px;border:3px solid var(--ink);border-radius:10px;background:var(--enamel);color:var(--ink);font:700 18px/1.1 var(--body);box-shadow:0 4px 0 var(--ink);transition:transform .05s,box-shadow .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.num{font:800 26px/1 var(--cond)}
.btn.on{background:var(--brass);color:#1f1b16}
.btn.go{background:var(--tomato);color:#fff4e0;font-size:21px}
.btn:disabled{opacity:.45}
.scale{display:flex;justify-content:space-between;font-size:13px;color:var(--soft);margin:6px 2px 0}
textarea,input[type=text]{width:100%;font:17px/1.3 var(--body);color:var(--ink);background:var(--enamel);border:2.5px solid var(--ink);border-radius:8px;padding:10px;margin-top:8px}
textarea{height:70px;resize:none}
#stamp{position:absolute;left:50%;top:38%;padding:8px 18px;border:6px solid var(--stamp);border-radius:8px;color:var(--stamp);font:800 46px/1 var(--cond);letter-spacing:.12em;
  transform:translate(-50%,-50%) rotate(-9deg) scale(2.2);opacity:0;pointer-events:none;z-index:9}
#stamp.hit{animation:stamp .34s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stamp{to{transform:translate(-50%,-50%) rotate(-9deg) scale(1);opacity:.92}}

/* gates and details */
.card{margin:auto 0;width:100%;max-width:440px;align-self:center}
.card h2{margin:0 0 10px;font:800 28px/1.05 var(--cond);letter-spacing:.03em}
.card p,.card ol{margin:0 0 12px}
.card ol{padding-left:22px}
.card li{margin-bottom:8px}
.err{color:var(--stamp);font-weight:700}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:2px dashed var(--paperline);font-size:16px}
.kv span:last-child{font-weight:700;text-align:right}

/* playing */
#player{position:absolute;inset:0;background:#000;z-index:6;display:flex;flex-direction:column}
#playbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top) + 6px) 12px 6px;background:#1f1b16;color:#efe6d2;font:700 15px/1 var(--cond);letter-spacing:.06em}
#player iframe{flex:1;min-height:0;width:100%;border:0;background:#000}
#done{padding:8px 16px;border:2.5px solid #efe6d2;border-radius:20px;background:var(--brass);color:#1f1b16;font:800 15px/1 var(--cond);letter-spacing:.08em}
@media (prefers-reduced-motion:reduce){.sheet,#big{transition:none}#stamp.hit{animation-duration:.01s}}
@media (max-height:640px){.big-text{font-size:19px}.quote{font-size:18px}.btn{min-height:48px}.g b{font-size:20px}}
</style>
</head>
<body>
<main id="machine">
  <div class="plate"><span class="rivet"></span><h1>R&amp;D ROOM</h1><span class="rivet"></span></div>
  <div class="stage">
    <div class="bezel"><button id="big" type="button"><span id="bigword">PRESS</span><small id="bigsmall">one random thing</small></button></div>
    <div class="slot" aria-hidden="true"></div>
    <p id="hint"></p>
  </div>
  <section class="gauges" aria-label="Sync status">
    <div class="g"><b id="gReady">0</b><span>Ready offline</span></div>
    <div class="g"><b id="gWait">0</b><span>Waiting to sync</span></div>
    <div class="g"><b id="gLast" class="small">never</b><span>Last synced</span></div>
  </section>
  <p id="status" role="status"></p>
  <button id="more" type="button">details</button>
</main>
<section id="sheet" class="sheet off" hidden></section>
<div id="stamp" aria-hidden="true">FILED</div>
<section id="player" hidden><div id="playbar"><span id="playtitle"></span><button id="done" type="button">DONE</button></div></section>
<script>
'use strict';
const APP_VERSION = '1.0.0';
const RESEND_MS = 6 * 3600e3;      // the channel keeps a message 12 h; a result the PC hasn't confirmed goes again
const MAX_SENDS = 40;              // per sync; the channel allows 250 a day
const SEND_TIMEOUT = 20000;

const $ = s => document.querySelector(s);
const enc = new TextEncoder(), dec = new TextDecoder();
const S = { keys: null, backlog: null, player: 'overseer', online: navigator.onLine, syncing: false, gamesReady: false, pack: null, packMsg: '', ticket: false, play: null, syncErr: '' };
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- base64url + crypto: rdroom/crypto.py is the other half ---------- */
const b64u = {
  to(buf) { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  from(s) { const t = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)); const u = new Uint8Array(t.length); for (let i = 0; i < t.length; i++) u[i] = t.charCodeAt(i); return u; },
};
async function deriveKeys(raw) {
  const base = await crypto.subtle.importKey('raw', raw, 'HKDF', false, ['deriveKey']);
  const mk = info => crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: enc.encode('rdroom-v1'), info: enc.encode(info) }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  return { backlog: await mk('backlog'), results: await mk('results') };
}
async function openBacklog(key, text) {
  const env = JSON.parse(text);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64u.from(env.iv), additionalData: enc.encode('rdroom-backlog-v1') }, key, b64u.from(env.ct));
  return JSON.parse(dec.decode(pt));
}
async function sealResult(key, row) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: enc.encode('rdroom-result-v1') }, key, enc.encode(JSON.stringify(row)));
  return 'rr1.' + b64u.to(iv) + '.' + b64u.to(ct);
}
const newId = () => 'r_' + Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, '0')).join('');

/* ---------- IndexedDB: results and "done" change in one transaction, so a crash can't split them ---------- */
let db;
function openDB() {
  return new Promise((ok, no) => {
    const r = indexedDB.open('rdroom', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('results', { keyPath: 'id' }); d.createObjectStore('done'); };
    r.onsuccess = () => { db = r.result; ok(); };
    r.onerror = () => no(r.error);
    r.onblocked = () => no(new Error('database blocked'));
  });
}
function tx(stores, mode, fn) {
  return new Promise((ok, no) => {
    const t = db.transaction(stores, mode);
    let out;
    fn(t, v => { out = v; });
    t.oncomplete = () => ok(out);
    t.onabort = t.onerror = () => no(t.error || new Error('transaction failed'));
  });
}
const kvGet = k => tx(['kv'], 'readonly', (t, ret) => { const r = t.objectStore('kv').get(k); r.onsuccess = () => ret(r.result); });
const kvSet = (k, v) => tx(['kv'], 'readwrite', t => t.objectStore('kv').put(v, k));
const kvDel = k => tx(['kv'], 'readwrite', t => t.objectStore('kv').delete(k));
const allResults = () => tx(['results'], 'readonly', (t, ret) => { const r = t.objectStore('results').getAll(); r.onsuccess = () => ret(r.result); });
const doneSet = () => tx(['done'], 'readonly', (t, ret) => { const r = t.objectStore('done').getAllKeys(); r.onsuccess = () => ret(new Set(r.result)); });

/* ---------- the setup link ---------- */
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
function parseLink(text) {
  const m = /(?:#|&|^)k=([A-Za-z0-9_-]{43})(?:&p=([a-z0-9_-]{1,32}))?/.exec((text || '').trim()) || /^([A-Za-z0-9_-]{43})$/.exec((text || '').trim());
  return m ? { k: m[1], p: m[2] || null } : null;
}
async function adopt(link) {
  const keys = await deriveKeys(b64u.from(link.k));
  await kvSet('keys', keys);
  await kvDel('key_ok');
  if (link.p) await kvSet('player', link.p);
  S.keys = keys;
  if (link.p) S.player = link.p;
}
function clearFragment() {
  // Safari on iOS keeps it: Add to Home Screen saves the current address, so the installed app can start already set up.
  if (location.hash && !(isIOS && !standalone())) history.replaceState(null, '', location.pathname);
}

/* ---------- sync: backlog down, results up. Safe to run any time, any number of times ---------- */
let syncing = null;
function sync() {
  if (!S.keys) return Promise.resolve();
  if (!syncing) syncing = doSync().catch(e => { S.syncErr = String(e && e.message || e).slice(0, 80); }).finally(() => { syncing = null; S.syncing = false; refresh(); });
  return syncing;
}
async function doSync() {
  S.syncing = true; S.syncErr = ''; refresh();
  let fetched = false;
  try {
    const r = await fetch('data/backlog.enc?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('backlog http ' + r.status);
    const text = await r.text();
    let b;
    try { b = await openBacklog(S.keys.backlog, text); }
    catch (e) {
      if (e && e.name === 'OperationError') return badKey();
      throw e;
    }
    await kvSet('key_ok', true);
    await applyBacklog(b);
    fetched = true;
  } catch (e) {
    if (e && e.name === 'TypeError') S.online = false; else S.syncErr = 'Could not read the backlog.';
  }
  const sent = await sendResults();
  if (fetched) S.online = true;
  if (fetched && sent) await kvSet('last_synced', new Date().toISOString());
  if (fetched) ensurePack();
  if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) navigator.serviceWorker.getRegistration().then(g => g && g.update()).catch(() => {});
}
async function applyBacklog(b) {
  S.backlog = b;
  await tx(['kv', 'results', 'done'], 'readwrite', t => {
    t.objectStore('kv').put(b, 'backlog');
    const acked = new Set(b.acked || []), rs = t.objectStore('results'), d = t.objectStore('done');
    (b.done || []).forEach(id => d.put(true, id));
    rs.getAllKeys().onsuccess = e => e.target.result.forEach(id => { if (acked.has(id)) rs.delete(id); });
  });
}
async function sendResults() {
  const write = S.backlog && S.backlog.write;
  if (!write) return false;
  const now = Date.now();
  const rows = (await allResults()).filter(r => !r.sent_at || now - r.sent_at > RESEND_MS).sort((a, b) => (a.row.ts < b.row.ts ? -1 : 1));
  let n = 0;
  for (const r of rows) {
    if (n++ >= MAX_SENDS) return false;
    let res;
    try {
      const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), SEND_TIMEOUT);
      res = await fetch(write.url, { method: 'POST', body: await sealResult(S.keys.results, r.row), signal: ctl.signal, cache: 'no-store' });
      clearTimeout(timer);
    } catch (e) { return false; }           // stays waiting; a send that did land is deduped by the PC
    if (!res.ok) { S.syncErr = res.status === 429 ? 'The channel is busy. Will retry.' : 'The channel refused a send. Will retry.'; return false; }
    await tx(['results'], 'readwrite', t => { const st = t.objectStore('results'); st.put({ ...r, sent_at: Date.now(), sends: (r.sends || 0) + 1 }); });
    refresh();
  }
  return true;
}
async function badKey() {
  const known = await kvGet('key_ok');
  await kvDel('keys'); await kvDel('key_ok');
  S.keys = null; S.backlog = known ? S.backlog : null;
  if (!known) await kvDel('backlog');
  gatePaste(known ? "This phone's key no longer opens the backlog. Your unsent results are safe here. Paste the new setup link." : "That link's key doesn't open this machine. Nothing was loaded.");
}

/* ---------- the game pack: fetched file by file so it survives being closed halfway ---------- */
const PACK_PREFIX = 'rdroom-pack-';
const packRunning = { on: false };
async function checkPack() {
  const meta = await kvGet('pack_meta');
  if (!meta || !('caches' in self)) { S.gamesReady = false; return; }
  const c = await caches.open(PACK_PREFIX + meta.hash);
  const have = new Set((await c.keys()).map(r => new URL(r.url).pathname));
  S.gamesReady = meta.files.every(f => have.has(new URL(f.p, location).pathname));
  S.pack = meta;
}
async function ensurePack() {
  if (packRunning.on || !('caches' in self)) return;
  if (isIOS && !standalone() && !(await kvGet('browser_ok'))) return;     // in Safari before install: the home-screen app has its own storage and fetches its own copy
  packRunning.on = true;
  try {
    const r = await fetch('pack.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const m = await r.json();
    const name = PACK_PREFIX + m.hash, c = await caches.open(name);
    const have = new Set((await c.keys()).map(q => new URL(q.url).pathname));
    let got = 0;
    for (const f of m.files) {
      const u = new URL(f.p, location);
      if (have.has(u.pathname)) { got += f.s; continue; }
      S.packMsg = `Getting games: ${(got / 1048576).toFixed(0)} of ${(m.bytes / 1048576).toFixed(0)} MB`; refresh();
      const res = await fetch(u.href + '?__dl=' + f.h.slice(0, 8), { cache: 'no-store' });
      if (!res.ok) throw new Error('game file ' + res.status);
      const buf = await res.arrayBuffer();
      const hex = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', buf)), b => b.toString(16).padStart(2, '0')).join('');
      if (hex !== f.h) throw new Error('game file damaged');
      await c.put(u.href, new Response(buf, { headers: { 'Content-Type': res.headers.get('Content-Type') || 'application/octet-stream' } }));
      got += f.s;
    }
    await kvSet('pack_meta', m);
    for (const k of await caches.keys()) if (k.startsWith(PACK_PREFIX) && k !== name) await caches.delete(k);
    S.packMsg = '';
    await checkPack();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) {
    S.packMsg = e && e.name === 'QuotaExceededError' ? 'Not enough room on this phone for the games.' : 'Games paused. They finish next time you open this online.';
  } finally {
    packRunning.on = false;
    refresh();
  }
}

/* ---------- screen ---------- */
function ago(iso) {
  if (!iso) return 'never';
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function poolOf(done) { return S.backlog ? S.backlog.deck.filter(i => !done.has(i.id)) : []; }
let refreshing = false, refreshAgain = false;

    $('#gReady').textContent = ready;
    $('#gWait').textContent = waiting;
    $('#gLast').textContent = ago(last);
    $('#big').classList.toggle('empty', ready === 0);
    $('#bigword').textContent = ready ? 'PRESS' : 'EMPTY';
    $('#bigsmall').textContent = ready ? 'one random thing' : (S.backlog ? 'nothing left yet' : 'open online once');
    let msg;

    else if (S.syncing && S.online) msg = 'Syncing…';
    else if (!S.online) msg = waiting ? `No service. ${waiting} waiting, safe on this phone. They send next time you open this online.` : 'No service. Everything you do is saved on this phone.';
    else if (S.syncErr) msg = S.syncErr;

setInterval(refresh, 30000);

const el = (tag, props, ...kids) => { const e = document.createElement(tag); Object.assign(e, props || {}); kids.flat().forEach(k => e.append(k)); return e; };

function showSheet(...kids) {

  sh.classList.remove('off');

}
function hideSheet(how) {

}

}

let pressing = false;
async function press() {

}
async function pressOnce() {

async function skip(it) {

function head(tag, it) {

}
function rowOf(buttons) { return el('div', { className: 'row' }, buttons); }

/* every result goes through here: stored and marked done in one transaction before the screen says FILED */
async function file(it, data, extra) {

  await tx(['results', 'done', 'kv'], 'readwrite', t => {
    t.objectStore('results').put({ id: row.id, row, sent_at: null, sends: 0 });

function ticketIdea(it) {

  const controls = el('div', { className: 'controls' }, el('p', { className: 'ask', textContent: 'How good?' }), rowOf(nums),
    el('div', { className: 'scale' }, el('span', { textContent: 'nah' }), el('span', { textContent: 'love it' })));
  function choose(n) {

    if (!controls.querySelector('.approve')) {

        rowOf([btn('Approve', () => file(it, { r: pick.r, ok: true })), btn('Deny', () => file(it, { r: pick.r, ok: false })), btn('Just the number', () => file(it, { r: pick.r, ok: null }))])));

    controls);

    el('div', { className: 'scroll' },
      el('p', { className: 'label', textContent: it.interrupted ? 'You stopped the agent and said' : 'You said' }), para('quote', it.said),
      el('p', { className: 'label', textContent: 'Before that, you said' }), para('ctx', it.before),

/* ---------- playing: time counts only while the game is on screen, and is saved as it goes ---------- */
function playTick() {
  const p = S.play;
  if (!p) return;
  const now = performance.now();
  if (p.last != null) p.acc += now - p.last;
  p.last = document.hidden ? null : now;
  kvSet('session', { item: p.item, acc: Math.round(p.acc) }).catch(() => {});
}
let playTimer = null;
async function startGame(it, acc) {
  hideSheet('off');
  S.play = { item: it, acc: acc || 0, last: performance.now() };
  await kvSet('session', { item: it, acc: acc || 0 });
  $('#playtitle').textContent = it.title;
  $('#player').append(el('iframe', { title: it.title, src: it.path, allow: 'autoplay; fullscreen' }));
  $('#player').hidden = false;

function endGame() {

  clearInterval(playTimer);

  const f = $('#player iframe');
  if (f) { f.src = 'about:blank'; f.remove(); }

function fmtTime(ms) { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

  const yes = btn('Yes', () => { pick.replay = true; yes.classList.add('on'); no.classList.remove('on'); check(); });

  const note = el('textarea', { placeholder: 'Anything to add? (optional)', maxLength: 500, rows: 2 });

    el('div', { className: 'tick-head' }, el('span', { className: 'tag', textContent: it.title }), el('button', { type: 'button', className: 'linky', textContent: 'back to the game', onclick: () => startGame(it, ms) })),
    el('div', { className: 'scroll' },
      el('p', { className: 'ask', textContent: `You played ${fmtTime(ms)}. How fun?` }), rowOf(nums),
      el('div', { className: 'scale' }, el('span', { textContent: 'dull' }), el('span', { textContent: 'great' })),
      el('p', { className: 'ask', style: 'margin-top:14px', textContent: 'Would you play it again?' }), rowOf([yes, no]), note),
    el('div', { className: 'controls' }, rowOf(go),

  $('#sheet').dataset.kind = 'afterplay';

/* ---------- gates ---------- */
function gatePaste(err) {
  const input = el('input', { type: 'text', placeholder: 'Paste it here', autocapitalize: 'off', autocomplete: 'off', spellcheck: false });
  const msg = para('err', err || '');
  showSheet(el('div', { className: 'card' },
    el('h2', { textContent: 'This machine needs its key' }),
    para('', 'Paste your private setup link. It stays on this phone.'),
    err ? msg : '', input,
    el('div', { className: 'row', style: 'margin-top:12px' }, btn('Open', async () => {
      const link = parseLink(input.value);
      if (!link) { msg.textContent = "That doesn't look like a setup link."; if (!msg.isConnected) input.before(msg); return; }
      await adopt(link);
      hideSheet('off');
      await sync();

    para('why', 'If iOS cleared this app, the link brings it back. Anything already sent is safe on the PC.')));

function gateInstall() {

    el('h2', { textContent: 'Put it on your Home Screen' }),
    el('ol', null,
      el('li', { textContent: 'Tap Copy setup link below, in case the app asks for it.' }),
      el('li', { textContent: 'In Safari, tap Share, then Add to Home Screen (it may be under View More), then Add.' }),
      el('li', { textContent: 'Open R&D Room from your Home Screen while you still have service, and wait until it says Ready for no service.' })),
    el('div', { className: 'row' }, btn('Copy setup link', async () => {
      try { await navigator.clipboard.writeText(location.href); copied.textContent = 'Copied. Keep it private: anyone with it can open this.'; }
      catch (e) { copied.textContent = 'Could not copy. Long-press the link in your message instead.'; }
    }, 'go')), copied,
    el('button', { type: 'button', className: 'linky', style: 'width:100%;margin-top:6px', textContent: 'Stay in Safari for now', onclick: async () => { await kvSet('browser_ok', true); hideSheet('off'); ensurePack(); } })));
  $('#sheet').dataset.kind = 'install';
}
async function details() {
  const done = await doneSet(), pool = poolOf(done), rows = await allResults();
  const count = k => pool.filter(i => i.kind === k).length;
  let storage = 'unknown', used = '';
  try { if (navigator.storage && navigator.storage.persisted) storage = (await navigator.storage.persisted()) ? 'protected from clearing' : 'iOS may clear it if space runs low'; } catch (e) {}
  try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); used = (e.usage / 1048576).toFixed(0) + ' MB'; } } catch (e) {}
  const kv = (a, b) => el('div', { className: 'kv' }, el('span', { textContent: a }), el('span', { textContent: b }));
  showSheet(head('Details'),
    el('div', { className: 'scroll' }, kv('Ideas left', String(count('idea'))), kv('Real-miss calls left', String(count('miss'))),
      kv('Games left', `${count('game')}${S.gamesReady ? '' : ' (not on this phone yet)'}`), kv('Sent, not yet confirmed', String(rows.filter(r => r.sent_at).length)),
      kv('Backlog built', S.backlog ? ago(S.backlog.built_at) : 'never'), kv('Storage used', used || 'unknown'), kv('Storage', storage), kv('Playing as', S.player), kv('Version', APP_VERSION)),
    el('div', { className: 'controls' }, rowOf([btn('Sync now', () => { hideSheet('off'); sync(); }), btn('Close', () => hideSheet('off'))]),
      el('button', { type: 'button', className: 'linky', style: 'width:100%', textContent: 'Paste a new setup link', onclick: () => gatePaste() })));
  $('#sheet').dataset.kind = 'details';
}
async function afterKey() {
  S.backlog = (await kvGet('backlog')) || S.backlog;
  await checkPack();
  refresh();
}

/* ---------- start ---------- */
async function boot() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  try { await openDB(); }
  catch (e) { $('#status').textContent = 'This browser refused to store anything (private mode?). Results could not be kept, so the machine is off.'; $('#big').disabled = true; return; }
  const link = parseLink(location.hash);
  if (link) {
    // a Home Screen icon may replay the same address on every launch: never let an old key undo a newer pasted one
    const fp = b64u.to(await crypto.subtle.digest('SHA-256', enc.encode(link.k))), seen = (await kvGet('seen_links')) || [];
    if (!(await kvGet('keys')) || !seen.includes(fp)) { await adopt(link); await kvSet('seen_links', seen.concat(fp)); }
  }
  clearFragment();
  S.keys = S.keys || (await kvGet('keys')) || null;
  S.player = (await kvGet('player')) || 'overseer';
  S.backlog = (await kvGet('backlog')) || null;
  await checkPack();
  $('#big').onclick = press;
  $('#done').onclick = endGame;
  $('#more').onclick = details;
  window.addEventListener('online', () => { S.online = true; sync(); });
  window.addEventListener('offline', () => { S.online = false; refresh(); });

  window.addEventListener('pagehide', playTick);

  const session = await kvGet('session');
  if (!S.keys) { gatePaste(); return; }
  if (session && session.item && !(await doneSet()).has(session.item.id)) ticketAfterPlay(session.item, session.acc || 0);
  else if (isIOS && !standalone() && !(await kvGet('browser_ok'))) gateInstall();
  await sync();

}
window.addEventListener('unhandledrejection', e => { const m = String(e.reason && e.reason.message || e.reason).slice(0, 80); S.syncErr = 'Problem: ' + m; refresh(); });
boot();
